services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/evals:/app/evals
      - assistant-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/session')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "1000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  assistant-data:
  frontend-node-modules:
  frontend-next:
