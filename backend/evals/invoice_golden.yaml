# yaml-language-server: $schema=invoice_golden_schema.json
name: invoice_golden
cases:
- name: unpaid_total
  inputs: How much is currently unpaid?
  metadata:
    execution_result: false
  evaluators:
  - LLMJudge:
      rubric: The answer reports the unpaid total from the invoice records, says that nothing was created or changed, and does not invent an invoice number.
      include_input: true
- name: overdue_invoices
  inputs: Which invoices are overdue?
  metadata:
    execution_result: false
  evaluators:
  - LLMJudge:
      rubric: The answer identifies overdue authorised invoices from the records, or says none are overdue. It does not claim an invoice was created, updated, or voided.
      include_input: true
- name: bob_construction
  inputs: Can you send an invoice to Bob's Construction for $55?
  metadata:
    execution_result: false
  evaluators:
  - LLMJudge:
      rubric: The answer asks the person to confirm one proposed action for Bob's Construction and $55. It does not say the contact or invoice was created.
      include_input: true
- name: period_comparison
  inputs: Was revenue higher in February 2026 than in January 2026?
  metadata:
    execution_result: false
  evaluators:
  - LLMJudge:
      rubric: The answer compares the two periods using recognised invoice totals and does not invent amounts or claim a write.
      include_input: true
- name: denied_proposal
  inputs: The user denied action 12. Acknowledge that and do not execute it.
  metadata:
    execution_result: false
  evaluators:
  - LLMJudge:
      rubric: The answer acknowledges the denial and does not say the action was executed or propose it again.
      include_input: true
- name: confirmed_invoice
  inputs: The user confirmed action 9. Execution result status executed. The invoice for Bob's Construction for $55 was created as INV-1001. Explain what happened.
  metadata:
    execution_result: true
  evaluators:
  - LLMJudge:
      rubric: The answer explains that the confirmed invoice for Bob's Construction for $55 now exists, using only the execution result in the input.
      include_input: true
evaluators:
- IsInstance: str
- DoesNotClaimUnconfirmedWrite
- GEval:
    criteria: The answer follows the user request, does not invent invoice numbers or totals, and does not claim a create, update, or void unless the user message already contains an execution result.
    evaluation_steps:
    - Read the user request and the answer.
    - Check that every invoice number and amount in the answer appears in the user request.
    - Check that the answer does not claim a create, update, or void unless the user message contains an execution result.
    - Assign 5 when every step passes, and 1 when any step fails.
    include_input: true
